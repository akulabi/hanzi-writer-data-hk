<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hanzi Writer JSON Batch Verifier</title>
<script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5.0/dist/hanzi-writer.min.js"></script>
<style>
  body {
    font-family: system-ui, -apple-system, "Noto Sans TC", sans-serif;
    margin: 0;
    padding: 24px;
    background: #f5f7fa;
    color: #222;
  }
  h1 { font-size: 22px; margin: 0 0 16px; }
  .card {
    background: white;
    border-radius: 12px;
    padding: 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,.08);
    margin-bottom: 20px;
  }
  label { display: block; font-weight: 600; margin-bottom: 6px; }
  textarea {
    width: 100%;
    min-height: 90px;
    padding: 10px;
    font-size: 16px;
    border: 1px solid #ccc;
    border-radius: 8px;
    box-sizing: border-box;
  }
  button {
    padding: 9px 14px;
    border: none;
    border-radius: 8px;
    background: #2563eb;
    color: white;
    font-size: 14px;
    cursor: pointer;
    margin: 10px 8px 0 0;
  }
  button.secondary { background: #64748b; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  #grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 16px;
  }
  .item {
    background: white;
    border: 1px solid #ddd;
    border-radius: 12px;
    padding: 12px;
  }
  .target {
    width: 180px;
    height: 180px;
    margin: 0 auto;
    border: 1px solid #eee;
    border-radius: 8px;
  }
  .title {
    font-size: 28px;
    text-align: center;
    margin-bottom: 8px;
  }
  .meta {
    font-size: 12px;
    color: #555;
    margin-top: 8px;
    white-space: pre-wrap;
  }
  .ok { color: #15803d; }
  .bad { color: #b91c1c; }
  .actions {
    display: flex;
    gap: 6px;
    justify-content: center;
    margin-top: 8px;
  }
  .actions button {
    margin: 0;
    padding: 6px 10px;
    font-size: 12px;
  }
  #status {
    margin-top: 12px;
    padding: 10px 12px;
    border-radius: 8px;
    white-space: pre-wrap;
  }
  .info { background: #e0f2fe; color: #075985; }
  .error { background: #fee2e2; color: #7f1d1d; }
  .success { background: #dcfce7; color: #14532d; }
</style>
</head>
<body>

<h1>Hanzi Writer JSON Batch Verifier</h1>

<div class="card">
  <label for="chars">Characters</label>
  <textarea id="chars" placeholder="花 蓮 草 茶&#10;or: 花蓮草茶">花 蓮</textarea>

  <div>
    <button id="load">Load JSON files</button>
    <button id="loadManifest" class="secondary">Load characters.txt</button>
    <button id="animateAll" class="secondary" disabled>Animate all</button>
  </div>

  <div id="status" class="info">
    Enter characters separated by spaces, commas, or new lines.
  </div>
</div>

<div id="grid"></div>

<script>
const $ = id => document.getElementById(id);
const items = new Map();

function setStatus(text, type = "info") {
  const el = $("status");
  el.textContent = text;
  el.className = type;
}

function parseCharacters(text) {
  return [...new Set(
    text
      .split(/[\s,，、\n]+/)
      .map(s => s.trim())
      .filter(Boolean)
  )];
}

function createCard(char) {
  const card = document.createElement("div");
  card.className = "item";
  card.innerHTML = `
    <div class="title">${char}</div>
    <div class="target" id="target-${char}"></div>
    <div class="meta" id="meta-${char}">Loading ${char}.json…</div>
    <div class="actions">
      <button data-char="${char}" data-action="animate">Animate</button>
      <button data-char="${char}" data-action="quiz">Quiz</button>
    </div>
  `;
  $("grid").appendChild(card);
  return card;
}

async function loadCharacter(char) {
  const path = `${encodeURIComponent(char)}.json`;
  const meta = $(`meta-${char}`);
  let data;

  try {
    const res = await fetch(path);

    if (!res.ok) {
      meta.innerHTML = `<span class="bad">Failed: ${path} (HTTP ${res.status})</span>`;
      return null;
    }

    data = await res.json();
  } catch (e) {
    meta.innerHTML = `<span class="bad">Fetch failed: ${path}</span>`;
    return null;
  }

  const strokes = Array.isArray(data.strokes) ? data.strokes : [];
  const medians = Array.isArray(data.medians) ? data.medians : [];
  const countOk = strokes.length > 0 && strokes.length === medians.length;

  if (!countOk) {
    meta.innerHTML =
      `<span class="bad">Invalid: ${strokes.length} strokes / ${medians.length} medians</span>`;
    return null;
  }

  const writer = HanziWriter.create(`target-${char}`, char, {
    width: 180,
    height: 180,
    padding: 10,
    strokeColor: "#333",
    radicalColor: "#168f48",
    showOutline: true,
    charDataLoader: () => data
  });

  meta.innerHTML =
    `<span class="ok">OK</span> — ${strokes.length} strokes` +
    (Array.isArray(data.radStrokes)
      ? `\nradStrokes: ${JSON.stringify(data.radStrokes)}`
      : "\nradStrokes: not provided");

  items.set(char, { writer, data });
  return writer;
}

async function loadCharacters(characters) {
  $("grid").innerHTML = "";
  items.clear();

  if (!characters.length) {
    setStatus("No characters entered.", "error");
    return;
  }

  setStatus(`Loading ${characters.length} file(s)…`, "info");

  const results = await Promise.all(
    characters.map(async char => {
      createCard(char);
      return loadCharacter(char);
    })
  );

  const loaded = results.filter(Boolean).length;
  const failed = characters.length - loaded;

  $("animateAll").disabled = loaded === 0;

  setStatus(
    failed === 0
      ? `Loaded ${loaded} character JSON file(s).`
      : `Loaded ${loaded}; failed ${failed}. Check that each <character>.json exists beside this HTML file.`,
    failed === 0 ? "success" : "error"
  );
}

function loadFromInput() {
  const chars = parseCharacters($("chars").value);
  loadCharacters(chars);
}

async function loadManifest() {
  try {
    const res = await fetch("characters.txt");

    if (!res.ok) {
      setStatus(`Could not load characters.txt (HTTP ${res.status}).`, "error");
      return;
    }

    const text = await res.text();
    $("chars").value = text.trim();
    loadFromInput();
  } catch (e) {
    setStatus("Could not load characters.txt. Create it beside this HTML file.", "error");
  }
}

function animateAll() {
  for (const [, item] of items) {
    item.writer.animateCharacter();
  }
  setStatus("Animating all loaded characters.", "info");
}

$("load").addEventListener("click", loadFromInput);
$("loadManifest").addEventListener("click", loadManifest);
$("animateAll").addEventListener("click", animateAll);

$("grid").addEventListener("click", event => {
  const button = event.target.closest("button[data-char]");
  if (!button) return;

  const char = button.dataset.char;
  const action = button.dataset.action;
  const item = items.get(char);

  if (!item) return;

  if (action === "animate") {
    item.writer.animateCharacter();
  } else if (action === "quiz") {
    item.writer.quiz();
  }
});
</script>

</body>
</html>
