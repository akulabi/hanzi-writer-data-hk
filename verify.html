  .card {
    background: white;
    border-radius: 12px;
    padding: 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,.08);
    margin-bottom: 20px;

  <div>
    <button id="load">Load JSON files</button>
    <button id="loadManifest" class="secondary">Load characters.txt</button>
    <button id="animateAll" class="secondary" disabled>Animate all</button>
  </div>

  <div id="status" class="info">
    Enter characters separated by spaces, commas, or new lines.
  </div>
</div>

<div id="grid"></div>

<script>
const $ = id => document.getElementById(id);
const items = new Map();

function setStatus(text, type = "info") {
  const el = $("status");
  el.textContent = text;
  el.className = type;
}

function parseCharacters(text) {
  return [...new Set(
    text
      .split(/[\s,，、\n]+/)
      .map(s => s.trim())
      .filter(Boolean)
  )];
}

function createCard(char) {
  const card = document.createElement("div");
  card.className = "item";
  card.innerHTML = `
    <div class="title">${char}</div>
    <div class="target" id="target-${char}"></div>
    <div class="meta" id="meta-${char}">Loading ${char}.json…</div>
    <div class="actions">
      <button data-char="${char}" data-action="animate">Animate</button>
      <button data-char="${char}" data-action="quiz">Quiz</button>
    </div>
  `;
  $("grid").appendChild(card);
  return card;
}

async function loadCharacter(char) {
  const path = `data/${encodeURIComponent(char)}.json`;
  const meta = $(`meta-${char}`);
  let data;

  try {
    const res = await fetch(path);

    if (!res.ok) {
      meta.innerHTML = `<span class="bad">Failed: ${path} (HTTP ${res.status})</span>`;
      return null;
    }

    data = await res.json();
  } catch (e) {
    meta.innerHTML = `<span class="bad">Fetch failed: ${path}</span>`;
    return null;
  }

  const strokes = Array.isArray(data.strokes) ? data.strokes : [];
  const medians = Array.isArray(data.medians) ? data.medians : [];
  const countOk = strokes.length > 0 && strokes.length === medians.length;

  if (!countOk) {
    meta.innerHTML =
      `<span class="bad">Invalid: ${strokes.length} strokes / ${medians.length} medians</span>`;
    return null;
  }

  const writer = HanziWriter.create(`target-${char}`, char, {
    width: 180,
    height: 180,
    padding: 10,
    strokeColor: "#333",
    radicalColor: "#168f48",
    showOutline: true,
    charDataLoader: () => data
  });

  meta.innerHTML =
    `<span class="ok">OK</span> — ${strokes.length} strokes` +
    (Array.isArray(data.radStrokes)
      ? `\nradStrokes: ${JSON.stringify(data.radStrokes)}`
      : "\nradStrokes: not provided");

  items.set(char, { writer, data });
  return writer;
}

async function loadCharacters(characters) {
  $("grid").innerHTML = "";
  items.clear();

  if (!characters.length) {
    setStatus("No characters entered.", "error");
    return;
  }

  setStatus(`Loading ${characters.length} file(s)…`, "info");

  const results = await Promise.all(
    characters.map(async char => {
      createCard(char);
      return loadCharacter(char);
    })
  );

  const loaded = results.filter(Boolean).length;
  const failed = characters.length - loaded;

  $("animateAll").disabled = loaded === 0;

  setStatus(
    failed === 0
      ? `Loaded ${loaded} character JSON file(s).`
      : `Loaded ${loaded}; failed ${failed}. Check that each <character>.json exists beside this HTML file.`,
    failed === 0 ? "success" : "error"
  );
}

function loadFromInput() {
  const chars = parseCharacters($("chars").value);
  loadCharacters(chars);
}

async function loadManifest() {
  try {
    const res = await fetch("characters.txt");

    if (!res.ok) {
      setStatus(`Could not load characters.txt (HTTP ${res.status}).`, "error");
      return;
    }

    const text = await res.text();
    $("chars").value = text.trim();
    loadFromInput();
  } catch (e) {
    setStatus("Could not load characters.txt. Create it beside this HTML file.", "error");
  }
}

function animateAll() {
  for (const [, item] of items) {
    item.writer.animateCharacter();
  }
  setStatus("Animating all loaded characters.", "info");
}

$("load").addEventListener("click", loadFromInput);
$("loadManifest").addEventListener("click", loadManifest);
$("animateAll").addEventListener("click", animateAll);

$("grid").addEventListener("click", event => {
  const button = event.target.closest("button[data-char]");
  if (!button) return;

  const char = button.dataset.char;
  const action = button.dataset.action;
  const item = items.get(char);

  if (!item) return;

  if (action === "animate") {
    item.writer.animateCharacter();
  } else if (action === "quiz") {
    item.writer.quiz();
  }
});
</script>
